<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd"/>
      <stop offset="100%" style="stop-color:#6610f2"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd"/>
      <stop offset="100%" style="stop-color:#6610f2"/>
    </linearGradient>
  </defs>

  <!-- ── Icon Mark ── -->
  <!-- Outer rounded square -->
  <rect x="2" y="4" width="42" height="42" rx="12" fill="url(#bookGrad)"/>

  <!-- Open book pages -->
  <path d="M12 30 Q23 14 23 14 Q23 14 34 30" fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Book spine center line -->
  <line x1="23" y1="14" x2="23" y2="33" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Left page lines -->
  <line x1="14" y1="25" x2="21" y2="20" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <line x1="13.5" y1="29" x2="21.5" y2="24" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
  <!-- Right page lines -->
  <line x1="32" y1="25" x2="25" y2="20" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <line x1="32.5" y1="29" x2="24.5" y2="24" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
  <!-- Book base -->
  <path d="M10 33 Q23 29 36 33" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Star / spark top-right of icon -->
  <circle cx="36" cy="10" r="4" fill="#fbbf24"/>
  <line x1="36" y1="5.5" x2="36" y2="8" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="12" x2="36" y2="14.5" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="31.5" y1="10" x2="33.8" y2="10" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38.2" y1="10" x2="40.5" y2="10" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32.8" y1="7.2" x2="34.4" y2="8.6" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="37.6" y1="11.4" x2="39.2" y2="12.8" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ── Wordmark ── -->
  <!-- "Edu" in dark -->
  <text x="52" y="33"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="22"
        font-weight="800"
        fill="#1a1a2e"
        letter-spacing="-0.5">Edu</text>
  <!-- "Learn" in gradient via clip trick -->
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d6efd"/>
      <stop offset="100%" style="stop-color:#6610f2"/>
    </linearGradient>
  </defs>
  <text x="88" y="33"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="22"
        font-weight="800"
        fill="url(#textGrad)"
        letter-spacing="-0.5">Learn</text>

  <!-- Tagline -->
  <text x="52" y="43"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="7"
        font-weight="500"
        fill="#6c757d"
        letter-spacing="1.8">LEARN WITHOUT LIMITS</text>
</svg>
