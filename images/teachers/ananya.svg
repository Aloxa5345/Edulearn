<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <clipPath id="circle"><circle cx="150" cy="150" r="150"/></clipPath>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#be185d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#831843;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="300" height="300" fill="url(#bg8)"/>
    <!-- Body / churidar kurta -->
    <ellipse cx="150" cy="278" rx="95" ry="52" fill="#9d174d"/>
    <rect x="100" y="215" width="100" height="85" fill="#9d174d"/>
    <!-- Chunni -->
    <path d="M100,215 Q80,240 90,280 L150,280 L150,230 Z" fill="#be185d" opacity="0.5"/>
    <!-- Neck -->
    <rect x="136" y="184" width="28" height="30" rx="5" fill="#c89060"/>
    <!-- Head -->
    <ellipse cx="150" cy="151" rx="51" ry="57" fill="#c89060"/>
    <!-- Hair in ponytail / plait -->
    <ellipse cx="150" cy="96" rx="52" ry="27" fill="#0a0a0a"/>
    <rect x="98" y="90" width="104" height="38" fill="#0a0a0a"/>
    <!-- Plait going to side -->
    <ellipse cx="203" cy="150" rx="11" ry="60" fill="#0a0a0a"/>
    <ellipse cx="99" cy="148" rx="10" ry="52" fill="#0a0a0a"/>
    <!-- Plait end ribbon -->
    <ellipse cx="203" cy="210" rx="10" ry="8" fill="#FFD700"/>
    <!-- Bindi pink -->
    <circle cx="150" cy="124" r="5" fill="#FF1493"/>
    <!-- Flower in hair -->
    <circle cx="195" cy="105" r="10" fill="#FF69B4"/>
    <circle cx="195" cy="105" r="6" fill="#FFD700"/>
    <!-- Eyebrows -->
    <path d="M118 133 Q133 125 148 130" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M152 130 Q167 125 182 133" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Eyes bright -->
    <ellipse cx="131" cy="147" rx="12" ry="8" fill="white"/>
    <ellipse cx="169" cy="147" rx="12" ry="8" fill="white"/>
    <circle cx="132" cy="148" r="5.5" fill="#3d1000"/>
    <circle cx="170" cy="148" r="5.5" fill="#3d1000"/>
    <circle cx="133" cy="146" r="2" fill="#0a0a0a"/>
    <circle cx="171" cy="146" r="2" fill="#0a0a0a"/>
    <circle cx="135" cy="145" r="1.5" fill="white"/>
    <circle cx="173" cy="145" r="1.5" fill="white"/>
    <!-- Kajal line -->
    <path d="M119,147 Q131,143 143,147" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
    <path d="M157,147 Q169,143 181,147" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
    <!-- Nose -->
    <ellipse cx="150" cy="163" rx="6" ry="5" fill="#b07030"/>
    <circle cx="146" cy="165" r="3" fill="#b07030"/>
    <circle cx="154" cy="165" r="3" fill="#b07030"/>
    <!-- Nose stud -->
    <circle cx="154" cy="162" r="2.5" fill="#FFD700"/>
    <!-- Bright smile -->
    <path d="M134 177 Q150 172 166 177" fill="#e04060"/>
    <path d="M134 177 Q150 187 166 177" fill="#c02040"/>
    <path d="M137 179 Q150 184 163 179" fill="white"/>
    <!-- Ears -->
    <ellipse cx="100" cy="154" rx="9" ry="12" fill="#c89060"/>
    <ellipse cx="200" cy="154" rx="9" ry="12" fill="#c89060"/>
    <!-- Chandbali earrings -->
    <ellipse cx="100" cy="158" rx="7" ry="10" fill="#FFD700" opacity="0.9"/>
    <ellipse cx="200" cy="158" rx="7" ry="10" fill="#FFD700" opacity="0.9"/>
    <!-- Name Tag -->
    <rect x="55" y="250" width="190" height="32" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="150" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">Ananya Krishnan</text>
  </g>
</svg>
