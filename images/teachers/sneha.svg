<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <clipPath id="circle"><circle cx="150" cy="150" r="150"/></clipPath>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7f1d1d;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="300" height="300" fill="url(#bg4)"/>
    <!-- Body / kurti -->
    <ellipse cx="150" cy="275" rx="95" ry="55" fill="#991b1b"/>
    <rect x="100" y="218" width="100" height="82" fill="#991b1b"/>
    <!-- Dupatta -->
    <ellipse cx="100" cy="240" rx="35" ry="50" fill="#b91c1c" opacity="0.7"/>
    <!-- Neck -->
    <rect x="135" y="184" width="30" height="30" rx="5" fill="#c8814e"/>
    <!-- Head -->
    <ellipse cx="150" cy="150" rx="51" ry="57" fill="#c8814e"/>
    <!-- Hair in bun style -->
    <ellipse cx="150" cy="96" rx="52" ry="26" fill="#0a0a0a"/>
    <rect x="98" y="90" width="104" height="38" fill="#0a0a0a"/>
    <!-- Bun at back -->
    <ellipse cx="150" cy="90" rx="25" ry="18" fill="#0a0a0a"/>
    <!-- Side hair strands -->
    <ellipse cx="99" cy="145" rx="13" ry="48" fill="#0a0a0a"/>
    <!-- Bindi -->
    <circle cx="150" cy="124" r="5" fill="#ff6600"/>
    <!-- Sindoor in parting -->
    <line x1="150" y1="90" x2="150" y2="108" stroke="#cc2200" stroke-width="3"/>
    <!-- Eyebrows -->
    <path d="M119 133 Q134 125 148 130" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M152 130 Q166 125 181 133" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="131" cy="146" rx="11" ry="8" fill="white"/>
    <ellipse cx="169" cy="146" rx="11" ry="8" fill="white"/>
    <circle cx="132" cy="147" r="5" fill="#1a0a00"/>
    <circle cx="170" cy="147" r="5" fill="#1a0a00"/>
    <circle cx="133" cy="145" r="2" fill="#0a0a0a"/>
    <circle cx="171" cy="145" r="2" fill="#0a0a0a"/>
    <circle cx="135" cy="144" r="1" fill="white"/>
    <circle cx="173" cy="144" r="1" fill="white"/>
    <!-- Eye liner -->
    <path d="M120,146 Q131,142 142,146" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
    <path d="M158,146 Q169,142 180,146" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
    <!-- Nose -->
    <ellipse cx="150" cy="162" rx="6" ry="5" fill="#b5692a"/>
    <circle cx="146" cy="164" r="3" fill="#b5692a"/>
    <circle cx="154" cy="164" r="3" fill="#b5692a"/>
    <!-- Nose pin gold -->
    <circle cx="146" cy="163" r="2.5" fill="#FFD700"/>
    <!-- Lips - red lipstick -->
    <path d="M135 177 Q150 172 165 177" fill="#cc1100"/>
    <path d="M135 177 Q150 185 165 177" fill="#aa0000"/>
    <!-- Ears -->
    <ellipse cx="100" cy="153" rx="9" ry="12" fill="#c8814e"/>
    <ellipse cx="200" cy="153" rx="9" ry="12" fill="#c8814e"/>
    <!-- Jhumka earrings -->
    <circle cx="100" cy="157" r="6" fill="#FFD700"/>
    <ellipse cx="100" cy="166" rx="5" ry="8" fill="#FFD700" opacity="0.8"/>
    <circle cx="200" cy="157" r="6" fill="#FFD700"/>
    <ellipse cx="200" cy="166" rx="5" ry="8" fill="#FFD700" opacity="0.8"/>
    <!-- Name Tag -->
    <rect x="60" y="248" width="180" height="32" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="150" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">Sneha Reddy</text>
  </g>
</svg>
